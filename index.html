      var t = localStorage.getItem('exam-clock-theme') || 'system';

      var p = new URLSearchParams(window.location.search);
      var l = p.get('lang') || localStorage.getItem('exam-clock-lang');
      if (!l) {
        var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
        if (nav.startsWith('es')) l = 'es';
        else if (nav.startsWith('pt')) l = 'pt';
        else l = 'en';
      }
      document.documentElement.lang = l;
    })();
  </script>

  <!-- ── Fonts ─────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:          #0c0e14;
      --surface:     #141720;
      --border:      #1e2433;
      --text:        #e8eaf0;
      --muted:       #4e566e;
      --accent-a:    #3d7fff;
      --accent-b:    #7c5cfc;
      --danger-a:    #ff3f3f;
      --danger-b:    #ff8c00;
      --bar-h:       52px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Setup ──────────────────────────────────────────── */

    #setup {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(61,127,255,.07) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 60%, rgba(124,92,252,.07) 0%, transparent 55%),
        var(--bg);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 48px;
      width: 100%;
      max-width: 420px;
      animation: fadeUp .45s ease both;
    }

    .card h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 36px;
    }

    .field { margin-bottom: 22px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field input[type="time"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 24px;
      padding: 12px 16px;
      outline: none;
      transition: border-color .2s;
      color-scheme: dark;
    }

    .field input[type="time"]:focus {
      border-color: var(--accent-a);
    }

    .btn {
      width: 100%;
      margin-top: 4px;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: .5px;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }

    .btn:hover  { opacity: .9; }
    .btn:active { transform: scale(.98); }

    /* ── Clock ──────────────────────────────────────────── */

    #clock-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding-bottom: calc(var(--bar-h) + 32px);
      background:
        radial-gradient(ellipse at 50% 35%, rgba(61,127,255,.04) 0%, transparent 60%),
        var(--bg);
    }

    #current-time {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(96px, 22vw, 280px);
      line-height: .88;
      letter-spacing: 4px;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      animation: fadeUp .5s ease both;
    }

    #chips {
      display: flex;
      gap: 36px;
      margin-top: 22px;
      animation: fadeUp .5s .1s ease both;
    }

    .chip { display: flex; flex-direction: column; align-items: center; gap: 4px; }

    .chip .lbl {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .chip .val {
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      color: var(--text);
    }

    #status {
      margin-top: 22px;
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      color: var(--muted);
      min-height: 24px;
      animation: fadeUp .5s .15s ease both;
    }

    #finished {
      display: none;
      margin-top: 18px;
      padding: 10px 28px;
      border: 1px solid var(--danger-a);
      border-radius: 6px;
      color: var(--danger-a);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      animation: fadeUp .4s ease both, blink 2.2s .5s ease-in-out infinite;
    }

    /* ── Progress bar ───────────────────────────────────── */

    #bar-track {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      height: var(--bar-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      transition: width .95s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 18px;
      position: relative;
      overflow: hidden;
    }

    #bar-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 0;
      width: 60px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.09));
      pointer-events: none;
    }

    #bar-fill.overtime {
      background: linear-gradient(90deg, var(--danger-a), var(--danger-b));
      width: 100% !important;
      transition: background .6s ease;
    }

    #bar-text {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: rgba(255,255,255,.75);
      white-space: nowrap;
      position: relative;
      z-index: 1;
    }

    /* ── Light theme ────────────────────────────────────── */
    html[data-theme="light"] {
      --bg:      #f2f4f8;
      --surface: #ffffff;
      --border:  #dde1eb;
      --text:    #111520;
      --muted:   #8490aa;
    }
    @media (prefers-color-scheme: light) {
      html:not([data-theme="dark"]) {
        --bg:      #f2f4f8;
        --surface: #ffffff;
        --border:  #dde1eb;
        --text:    #111520;
        --muted:   #8490aa;
      }
    }
    html[data-theme="light"] .field input[type="time"] { color-scheme: light; }
    @media (prefers-color-scheme: light) {
      html:not([data-theme="dark"]) .field input[type="time"] { color-scheme: light; }
    }

    /* ── Top controls (Language & Theme) ─────────────────── */
    #top-bar {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }

    #lang-switcher,
    #theme-switcher {
      display: flex;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      transition: background .25s, border-color .25s;
    }

    .lang-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 5px 8px;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .5px;
      line-height: 1.3;
      transition: background .15s, color .15s;
    }
    .lang-btn:hover  { background: var(--border); color: var(--text); }
    .lang-btn.active { background: var(--border); color: var(--text); font-weight: 700; }

    .theme-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, color .15s;
    }
    .theme-btn:hover  { background: var(--border); color: var(--text); }
    .theme-btn.active { background: var(--border); color: var(--text); }

    @media (max-width: 480px) {
      .card { padding: 32px 24px; }
      #top-bar { top: 12px; right: 12px; gap: 6px; }
      .lang-btn { padding: 4px 6px; font-size: 10px; }
      .theme-btn { padding: 5px 6px; }
    }

    /* ── Animations ─────────────────────────────────────── */

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: .45; border-color: transparent; }
    }
  </style>
</head>
<body>

<!-- ── Setup screen ──────────────────────────────────────── -->
<div id="setup">
  <div class="card">
    <h1 data-i18n="setupTitle">Exam Clock</h1>
    <p data-i18n="setupDesc">Set the exam window. The clock will track progress and alert when time is up.</p>

    <div class="field">
      <label data-i18n="startLabel">Start time</label>
      <input type="time" id="start-input" step="60" />

  <div id="chips">
    <div class="chip">
      <span class="lbl" data-i18n="chipStart">Start</span>
      <span class="val" id="chip-start">--:--</span>
    </div>
    <div class="chip">
      <span class="lbl" data-i18n="chipEnd">End</span>

  <div id="status"></div>

</div>

<!-- ── Progress bar ──────────────────────────────────────── -->
<div id="bar-track">
  <div id="bar-fill">
    <span id="bar-text"></span>
  </div>
</div>

<script>
  // ── Internationalization Dictionary ────────────────────────
  const I18N = {
    en: {
      seoTitle: "Exam Clock — Free Online Exam Timer with Countdown",
      seoDesc: "Free online exam clock. Enter start and end times to get a live countdown, animated progress bar, and automatic overtime tracking when time runs out.",
      setupTitle: "Exam Clock",
      setupDesc: "Set the exam window. The clock will track progress and alert when time is up.",
      startLabel: "Start time",
      endLabel: "End time",
      startBtn: "Start Exam Clock →",
      chipStart: "Start",
      chipEnd: "End",
      startsIn: "Starts in {time}",
      remaining: "{time} remaining",
      overtime: "+{time} overtime",
      finished: "Exam Finished",
      alertMissing: "Please enter both start and end times.",
      alertOrder: "End time must be after start time.",
      themeLight: "Light mode",
      themeSystem: "System preference",
      themeDark: "Dark mode",
      colorThemeLabel: "Color theme",
      langLabel: "Language"
    },
    es: {
      seoTitle: "Reloj de Examen — Temporizador Online con Cuenta Regresiva",
      seoDesc: "Reloj de examen online gratis. Ingresa las horas de inicio y fin para ver una cuenta regresiva en vivo, barra de progreso animada y seguimiento de tiempo extra.",
      setupTitle: "Reloj de Examen",
      setupDesc: "Configura el horario del examen. El reloj controlará el progreso y avisará cuando termine el tiempo.",
      startLabel: "Hora de inicio",
      endLabel: "Hora de finalización",
      startBtn: "Iniciar Reloj de Examen →",
      chipStart: "Inicio",
      chipEnd: "Fin",
      startsIn: "Comienza en {time}",
      remaining: "{time} restantes",
      overtime: "+{time} tiempo extra",
      finished: "Examen Finalizado",
      alertMissing: "Por favor ingresa tanto la hora de inicio como la de finalización.",
      alertOrder: "La hora de finalización debe ser posterior a la de inicio.",
      themeLight: "Modo claro",
      themeSystem: "Preferencia del sistema",
      themeDark: "Modo oscuro",
      colorThemeLabel: "Tema de color",
      langLabel: "Idioma"
    },
    pt: {
      seoTitle: "Relógio de Exame — Temporizador Online com Contagem Regressiva",
      seoDesc: "Relógio de exame online grátis. Insira os horários de início e término para contagem regressiva ao vivo, barra de progresso animada e tempo extra.",
      setupTitle: "Relógio de Exame",
      setupDesc: "Defina o horário da prova. O relógio acompanhará o progresso e avisará quando o tempo acabar.",
      startLabel: "Hora de início",
      endLabel: "Hora de término",
      startBtn: "Iniciar Relógio de Exame →",
      chipStart: "Início",
      chipEnd: "Fim",
      startsIn: "Começa em {time}",
      remaining: "{time} restantes",
      overtime: "+{time} tempo extra",
      finished: "Exame Finalizado",
      alertMissing: "Por favor, insira o horário de início e de término.",
      alertOrder: "O horário de término deve ser posterior ao de início.",
      themeLight: "Modo claro",
      themeSystem: "Preferência do sistema",
      themeDark: "Modo escuro",
      colorThemeLabel: "Tema de cores",
      langLabel: "Idioma"
    }
  };

  const LANG_KEY = 'exam-clock-lang';
  let currentLang = 'en';
  let updateClockTick = null;

  function t(key, replacements) {
    let str = (I18N[currentLang] && I18N[currentLang][key]) || (I18N.en[key] || '');
    if (replacements) {
      for (const [k, v] of Object.entries(replacements)) {
        str = str.replace(`{${k}}`, v);
      }
    }
    return str;
  }

  function applyLang(lang) {
    if (!I18N[lang]) lang = 'en';
    currentLang = lang;
    document.documentElement.lang = lang;
    localStorage.setItem(LANG_KEY, lang);

    // Update text elements with data-i18n
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (I18N[lang] && I18N[lang][key]) {
        el.textContent = I18N[lang][key];
      }
    });

    // Update switcher buttons and accessibility titles
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === lang);
    });

    const langSwitcher = document.getElementById('lang-switcher');
    if (langSwitcher) langSwitcher.setAttribute('aria-label', t('langLabel'));

    const themeSwitcher = document.getElementById('theme-switcher');
    if (themeSwitcher) themeSwitcher.setAttribute('aria-label', t('colorThemeLabel'));

    const btnLight = document.querySelector('.theme-btn[data-theme="light"]');
    if (btnLight) btnLight.title = t('themeLight');
    const btnSys = document.querySelector('.theme-btn[data-theme="system"]');
    if (btnSys) btnSys.title = t('themeSystem');
    const btnDark = document.querySelector('.theme-btn[data-theme="dark"]');
    if (btnDark) btnDark.title = t('themeDark');

    // Update document title and meta description
    const titleEl = document.getElementById('doc-title');
    if (titleEl) titleEl.textContent = t('seoTitle');
    const descEl = document.getElementById('meta-desc');
    if (descEl) descEl.content = t('seoDesc');

    // If clock is running, immediately refresh text strings
    if (typeof updateClockTick === 'function') {
      updateClockTick();
    }

    // Keep URL parameter synchronized without reloading
    const url = new URL(window.location);
    if (url.searchParams.has('start') && url.searchParams.has('end')) {
      url.searchParams.set('lang', lang);
      window.history.replaceState({}, '', url.toString());
    }
  }

  // Determine initial language: URL param > localStorage > browser language
  (function initLang() {
    const params = new URLSearchParams(window.location.search);
    const paramLang = params.get('lang');
    const storedLang = localStorage.getItem(LANG_KEY);
    let resolved = 'en';

    if (paramLang && I18N[paramLang]) {
      resolved = paramLang;
    } else if (storedLang && I18N[storedLang]) {
      resolved = storedLang;
    } else {
      const navLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (navLang.startsWith('es')) resolved = 'es';
      else if (navLang.startsWith('pt')) resolved = 'pt';
    }

    applyLang(resolved);

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });
  })();

  // ── Theme ──────────────────────────────────────────────────
  (function() {
    const KEY = 'exam-clock-theme';
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const darkMQ    = window.matchMedia('(prefers-color-scheme: dark)');

    function isDarkActive(theme) {
      return theme === 'dark' || (theme === 'system' && darkMQ.matches);
    }

    function applyTheme(theme) {
      const html = document.documentElement;
      if (theme === 'system') html.removeAttribute('data-theme');
      else html.setAttribute('data-theme', theme);

      document.querySelectorAll('.theme-btn').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.theme === theme)
      );
      if (metaTheme) metaTheme.content = isDarkActive(theme) ? '#0c0e14' : '#f2f4f8';
    }

    function setTheme(theme) {
      localStorage.setItem(KEY, theme);
      applyTheme(theme);
    }

    // Boot with stored preference
    applyTheme(localStorage.getItem(KEY) || 'system');

    document.querySelectorAll('.theme-btn').forEach(btn =>
      btn.addEventListener('click', () => setTheme(btn.dataset.theme))
    );

    // Re-apply when OS preference changes (only affects system mode)
    darkMQ.addEventListener('change', () => {
      if ((localStorage.getItem(KEY) || 'system') === 'system') applyTheme('system');
    });
  })();

  // ── Helpers ────────────────────────────────────────────────
  function pad(n) { return String(n).padStart(2, '0'); }

  function fmtDuration(totalSecs) {
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = totalSecs % 60;
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }

  function parseHHMM(str) {
    const [h, m] = str.split(':').map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  }

  // ── Setup form ─────────────────────────────────────────────
  function launch() {
    const s = document.getElementById('start-input').value;
    const e = document.getElementById('end-input').value;
    if (!s || !e)  { alert(t('alertMissing')); return; }
    if (s >= e)    { alert(t('alertOrder')); return; }
    window.location.search = `?start=${encodeURIComponent(s)}&end=${encodeURIComponent(e)}&lang=${encodeURIComponent(currentLang)}`;
  }

  document.getElementById('start-input').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') document.getElementById('end-input').focus();
  });
  document.getElementById('end-input').addEventListener('keydown', ev => {
    if (ev.key === 'Enter') launch();
  });

  // ── Clock ──────────────────────────────────────────────────
  const params   = new URLSearchParams(window.location.search);
  const sp       = params.get('start');
  const ep       = params.get('end');

  if (sp && ep) {
    document.getElementById('setup').style.display     = 'none';
    document.getElementById('clock-view').style.display = 'flex';

    const startDate = parseHHMM(sp);
    const endDate   = parseHHMM(ep);
    const total     = endDate - startDate;

    document.getElementById('chip-start').textContent = sp;
    document.getElementById('chip-end').textContent   = ep;

    const elTime     = document.getElementById('current-time');
    const elStatus   = document.getElementById('status');
    const elFinished = document.getElementById('finished');
    const elFill     = document.getElementById('bar-fill');
    const elBarText  = document.getElementById('bar-text');

    let wasOvertime = false;

    function tick() {
      const now = new Date();

      // Big clock display
      elTime.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      if (now < startDate) {
        // Not started yet
        const secs = Math.ceil((startDate - now) / 1000);
        elStatus.textContent = t('startsIn', { time: fmtDuration(secs) });
        elFill.style.width = '0%';
        elBarText.textContent = '';
        elFill.classList.remove('overtime');

      } else if (now <= endDate) {
        // In progress
        const elapsed    = now - startDate;
        const pct        = Math.min((elapsed / total) * 100, 100);
        const remaining  = Math.max(0, Math.ceil((endDate - now) / 1000));
        elStatus.textContent = t('remaining', { time: fmtDuration(remaining) });
        elFill.style.width = pct + '%';
        elBarText.textContent = '';
        elFill.classList.remove('overtime');

      } else {
        // Overtime
        const overSecs = Math.floor((now - endDate) / 1000);
        elStatus.textContent = '';
        if (!wasOvertime) {
          elFinished.style.display = 'block';
          elFill.classList.add('overtime');
          wasOvertime = true;
        }
        elBarText.textContent = t('overtime', { time: fmtDuration(overSecs) });
      }
    }

    updateClockTick = tick;
    tick();
    setInterval(tick, 1000);
  }
</script>
</body>
</html>
